<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>音声点呼</title><style>
:root{--green:#087f5b;--navy:#123b46;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#eff4f5;color:#172126}header{background:var(--navy);color:#fff;padding:18px 5vw}main{max-width:720px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 3px 18px #0001;margin-bottom:18px}label{display:block;font-weight:700;margin:12px 0 5px}input,select{width:100%;padding:13px;border:1px solid #b9c5c9;border-radius:9px;font-size:16px}button{border:0;border-radius:10px;padding:14px 20px;font-size:17px;font-weight:700;color:white;background:var(--green);cursor:pointer}.question{font-size:1.5rem;font-weight:750;line-height:1.55;padding:22px;background:#e6f4ef;border-left:6px solid var(--green);border-radius:10px;margin:18px 0}.actions{display:flex;gap:12px}.actions button{flex:1}.no{background:var(--red)}.listen{background:#245b78;width:100%;margin-top:12px}.status{padding:12px;border-radius:8px;background:#edf1f2}.hidden{display:none}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#8b989d;margin-right:7px}.active .dot{background:#e5484d;box-shadow:0 0 0 5px #e5484d22}a{color:var(--green)}small{color:#52636a}</style></head>
<body><header><h1>音声点呼</h1><div>安全運行のための確認を行います</div></header><main>
<div id="setup" class="card"><h2>点呼を開始</h2><label>車番</label><input id="driverId" autocomplete="username" required placeholder="車番"><label>氏名</label><input id="driverName" autocomplete="name"><label>点呼シナリオ</label><select id="scenario">{% for s in scenarios %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><button id="start" style="width:100%;margin-top:18px">開始する</button><p><small>開始すると音声で質問します。マイク利用を許可してください。</small></p></div>
<div id="call" class="card hidden"><div id="progress"></div><div id="question" class="question"></div><div id="micStatus" class="status"><span class="dot"></span><span>回答してください</span></div><button id="listen" class="listen">🎤 音声で回答する</button><p style="text-align:center">またはボタンで回答</p><div class="actions"><button id="yes">はい</button><button id="no" class="no">いいえ</button></div></div>
<div id="done" class="card hidden"><h2>点呼が完了しました</h2><p id="result"></p><button onclick="location.reload()">次の点呼</button></div>
<p><a href="/">管理画面へ戻る</a></p></main>
<script>
let checkinId=null, questions=[], index=0, recognition=null;
const $=id=>document.getElementById(id);
function speak(text){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.92;speechSynthesis.speak(u)}
async function start(){
 const participant_id=$('driverId').value.trim(); if(!participant_id){alert('車番を入力してください');return}
 const scenario_id=Number($('scenario').value); const all=await fetch('/api/scenarios').then(r=>r.json()); const selected=all.find(s=>s.id===scenario_id);questions=selected.questions;
 const res=await fetch('/api/checkins/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({participant_id,participant_name:$('driverName').value.trim(),scenario_id})});
 checkinId=(await res.json()).id;$('setup').classList.add('hidden');$('call').classList.remove('hidden');showQuestion();
}
function showQuestion(){const q=questions[index];$('progress').textContent='質問 '+(index+1)+' / '+questions.length;$('question').textContent=q.text;$('micStatus').classList.remove('active');$('micStatus').lastElementChild.textContent='回答してください';speak(q.text)}
function classify(text){const t=text.trim().toLowerCase();const yes=['はい','yes','あります','持っています','問題ありません','大丈夫です'];const no=['いいえ','no','ありません','持っていません','問題があります'];if(yes.some(v=>t.includes(v)))return {text,is_ok:true};if(no.some(v=>t.includes(v)))return {text,is_ok:false};return null}
async function submit(answer,is_ok){speechSynthesis.cancel();const q=questions[index];await fetch('/api/checkins/'+checkinId+'/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_key:q.key,question_text:q.text,answer_text:answer,is_ok})});index++;if(index<questions.length){showQuestion()}else{await fetch('/api/checkins/'+checkinId+'/complete',{method:'POST'});$('call').classList.add('hidden');$('done').classList.remove('hidden');$('result').textContent='回答を記録しました。'+(is_ok?'':'管理者による確認が必要な回答があります。');speak('点呼が完了しました。ありがとうございました。')}}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('このブラウザは音声認識に対応していません。ボタンで回答してください。');return}recognition=new SR();recognition.lang='ja-JP';recognition.interimResults=false;recognition.onstart=()=>{$('micStatus').classList.add('active');$('micStatus').lastElementChild.textContent='聞き取り中…'};recognition.onerror=e=>{$('micStatus').classList.remove('active');$('micStatus').lastElementChild.textContent='聞き取れませんでした。もう一度お試しください'};recognition.onresult=e=>{const text=e.results[0][0].transcript;$('micStatus').lastElementChild.textContent='認識結果：'+text;const result=classify(text);if(result)setTimeout(()=>submit(result.text,result.is_ok),500);else $('micStatus').lastElementChild.textContent+='（はい・いいえで回答してください）'};recognition.start()}
$('start').onclick=start;$('listen').onclick=listen;$('yes').onclick=()=>submit('はい',true);$('no').onclick=()=>submit('いいえ',false);
</script></body></html>
